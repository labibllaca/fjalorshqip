<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="description" content="Fjalori i gjuhës shqipe" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="search" type="application/opensearchdescription+xml" title="FjalorShqip Search" href="/opensearch.xml" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#d53" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" />
    <title>Fjalor Shqip</title>
  </head>
  <body>
     <script>
       try {
         var t = localStorage.getItem('theme') || 'system';
         document.documentElement.setAttribute('data-theme', t);
       } catch(e) {}
     </script>
     <script>
       (function(){
         var T = 160, overlay = null, root = document.getElementById('root');
         function show() {
           if (overlay) return;
           root = document.getElementById('root');
           if (!root) return;
           root.innerHTML = '';
           overlay = document.createElement('div');
           overlay.id = 'dt-overlay';
           overlay.innerHTML = '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#d53" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><h1 style="font-size:clamp(1.25rem,4vw,2rem);margin:1.5rem 0 0.75rem;line-height:1.3">Mjetet e zhvilluesit u zbuluan</h1><p style="font-size:clamp(0.875rem,2vw,1.125rem);color:#ef4444;max-width:420px;line-height:1.5;margin:0">Qasja \u00ebsht\u00eb e bllokuar p\u00ebr arsye sigurie. Mbyll mjetet e zhvilluesit p\u00ebr t\u00eb vazhduar.</p>';
           Object.assign(overlay.style, { position:'fixed', inset:'0', zIndex:'999999', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:'var(--bg,#0d1117)', color:'#d53', fontFamily:'Inter,system-ui,sans-serif', textAlign:'center', padding:'2rem' });
           document.body.append(overlay);
         }
         setInterval(function(){
           var o = window.outerWidth - window.innerWidth > T || window.outerHeight - window.innerHeight > T;
           if (o && !overlay) { show(); sessionStorage.setItem('dt_reload','1'); }
           else if (!o && overlay) { overlay.remove(); overlay = null; if (sessionStorage.getItem('dt_reload')) { sessionStorage.removeItem('dt_reload'); location.reload(); } }
         }, 500);
       })();
     </script>
     <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
